name: CI

# Modelled on OxyHQ/Mention's CI: every check is a named job, and `ci-complete`
# is the ONE required check, failing unless every job actually passed — a job
# that was skipped by a future `if:` edit reads as a failure, not a pass.
#
# The one sanctioned skip: on a PULL REQUEST, `tests`, `web` and `image` run
# only when the `changes` job says the diff reaches them. Push to main and
# workflow_dispatch always run everything, and `ci-complete` accepts a skip ONLY
# when `changes` itself succeeded and said "not affected" — any other skip, and
# a failed `changes`, is still a failure.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes the run still testing the old head,
# so that run is cancelled. Nothing else is ever cancelled or queued: a push to
# main (or a dispatch) gets a group of its own through the run id. Until 2026-10
# every main run shared `ci-CI-refs/heads/main`, and even with cancel-in-progress
# off GitHub keeps one PENDING run per group, so a third merge cancelled the
# second one's CI before it ran. The deploys no longer rely on main's CI
# finishing in order: their `gate` job admits only the newest CI-tested commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in lockstep with packages/backend/Dockerfile (`oven/bun:<ver>`): a
  # different bun between CI and the image is how `lockfile had changes, but
  # lockfile is frozen` appears only at image build time.
  BUN_VERSION: '1.4.3'

jobs:
  # PR-only. Shared inputs (lockfile, root manifests, tsconfig, shared-types,
  # anything under .github/) mark every job affected. `bun run test` runs the
  # FRONTEND suite as well as the backend one, so `tests` is affected by both.
  changes:
    name: Affected paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tests: ${{ steps.filter.outputs.tests }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            shared: &shared
              - bun.lock
              - package.json
              - bunfig.toml
              - tsconfig.json
              - 'packages/shared-types/**'
              - '.github/**'
            tests:
              - *shared
              - 'packages/backend/**'
              - 'packages/frontend/**'
            web:
              - *shared
              - 'packages/frontend/**'
            image:
              - *shared
              - '.dockerignore'
              - 'packages/backend/**'
              - 'packages/frontend/package.json'

  quality:
    name: Gates, typecheck, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Expo SDK 58's CLI needs Node 22.13+ / 24.3+; `expo` runs under node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Repository gates (AGENTS.md budget, migration phase markers, workflow secrets)
        run: bun run validate:agents-md && bun run validate:gates
      - name: Typecheck backend and frontend
        run: bun run typecheck
      - name: Biome (format and lint, whole repository)
        run: bunx biome ci .
      - name: Expo ESLint rules Biome lacks (frontend)
        run: bun run --cwd packages/frontend lint
      - name: Build backend
        run: bun run build

      # The production image's build inputs (Dockerfile, context, target and
      # both .dockerignore files) must match the one reviewed pin in
      # .github/scripts/reviewed-images.json. The deploy refuses to build on a
      # mismatch, so catching it here is what stops a merge from stranding
      # main undeployable. The fixture tests run first so a green check means
      # the gate can fail, not that it stopped looking.
      - name: Prove the reviewed-image gate can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_reviewed_image.py
      - name: Prove the base-image digest bump can fail
        run: python3 -B -m unittest discover -s .github/scripts -p test_bump_base_digests.py
      - name: Verify the production image's build inputs are reviewed
        run: python3 -B .github/scripts/reviewed-image.py check
      # Both deploys admit a release through require-current-main.sh. Its
      # refusals keep an older rollout off a newer one and its admissions keep a
      # CI-green commit from being stranded, so each is driven both ways.
      - name: Prove the deploy head guard can fail
        run: bash .github/scripts/test-require-current-main.sh

  lockfile:
    name: Lockfile is in sync with every manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # `--frozen-lockfile` is not a sync check (it passes on a widened range);
      # a plain install followed by asking git whether bun.lock moved is.
      - name: Install and require an unchanged bun.lock
        run: |
          set -euo pipefail
          bun install --ignore-scripts
          git diff --exit-code bun.lock

  tests:
    name: Backend tests (real Postgres)
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.tests == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: move
          POSTGRES_PASSWORD: move
          POSTGRES_DB: move_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U move -d move_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      # The pipeline suite REFUSES to run without a database rather than skip,
      # so a missing service fails here instead of reporting a hollow green.
      - name: Run the backend suite
        env:
          TEST_DATABASE_URL: postgres://move:move@127.0.0.1:5432/move_ci
        run: bun run test
      - name: Migrations apply from zero with the production migrator
        env:
          DATABASE_URL: postgres://move:move@127.0.0.1:5432/move_ci
        run: bun run --cwd packages/backend db:migrate --target-database=move_ci --phase=all

  web:
    name: Web export honours the static hosting contract
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Expo SDK 58's CLI needs Node 22.13+ / 24.3+; `expo` runs under node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Export the web app
        env:
          EXPO_PUBLIC_API_URL: https://api.move.oxy.so
        run: bun run build:shared-types && bun run build:frontend
      - name: The export carries the security headers and a single SPA shell
        run: |
          set -euo pipefail
          dist=packages/frontend/dist
          test -f "$dist/index.html"
          grep -q '_expo/static/js/web/' "$dist/index.html"
          grep -qx '  X-Content-Type-Options: nosniff' "$dist/_headers"
          grep -qx '  Referrer-Policy: strict-origin-when-cross-origin' "$dist/_headers"

  # Builds the production image exactly as the deploy does (the guard hands out
  # the Dockerfile and context; linux/arm64 on an arm runner; reads the deploy's
  # layer cache but never writes it; never pushes), then proves it: what the
  # runtime image contains and who can write it, the migrator and the server
  # against a real Postgres and Redis, readiness, the Dockerfile HEALTHCHECK,
  # and the post-deploy smoke script with its negative control.
  image:
    name: Production image builds and boots
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.image == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: move
          POSTGRES_PASSWORD: move
          POSTGRES_DB: move_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U move -d move_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      IMAGE: move-image-smoke:ci
      DATABASE_URL: postgres://move:move@127.0.0.1:5432/move_ci
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Refuse unreviewed image build inputs
        id: reviewed
        run: python3 -B .github/scripts/reviewed-image.py guard --recipe move

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the production image (load only, never pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.reviewed.outputs.context }}
          file: ${{ steps.reviewed.outputs.dockerfile }}
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          labels: |-
            org.opencontainers.image.revision=${{ github.sha }}
            io.oxy.source.tree=${{ steps.reviewed.outputs.source_tree }}
            io.oxy.build-inputs.sha256=${{ steps.reviewed.outputs.build_inputs_sha256 }}
          cache-from: type=gha,scope=move-backend
          provenance: false
          sbom: false

      - name: The image carries the reviewed build-inputs label
        env:
          EXPECTED: ${{ steps.reviewed.outputs.build_inputs_sha256 }}
        run: |
          set -euo pipefail
          actual="$(docker image inspect "$IMAGE" --format '{{ index .Config.Labels "io.oxy.build-inputs.sha256" }}')"
          echo "label: $actual"
          [ -n "$EXPECTED" ] && [ "$actual" = "$EXPECTED" ]

      # Runs INSIDE the image as its own user. The walk must find the packages
      # the server needs (the positive control) before an absence means anything.
      - name: Runtime image holds only the backend's production closure, root-owned
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/assert-image.mjs" <<'JS'
          import { accessSync, constants, existsSync, lstatSync, readdirSync, readFileSync, rmSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const failures = [];
          if (process.getuid() !== 1001) failures.push(`runs as uid ${process.getuid()}, expected 1001 (appuser)`);
          let files = 0;
          let bytes = 0;
          const notRoot = [];
          const writable = [];
          const visit = (path) => {
            const stat = lstatSync(path);
            if (stat.uid !== 0 || stat.gid !== 0) notRoot.push(`${path} (${stat.uid}:${stat.gid})`);
            if (stat.isSymbolicLink()) return;
            try { accessSync(path, constants.W_OK); writable.push(path); } catch {}
            if (stat.isDirectory()) for (const name of readdirSync(path)) visit(join(path, name));
            else { files += 1; bytes += stat.size; }
          };
          visit('/app');
          if (notRoot.length) failures.push(`not owned by root:root: ${notRoot.slice(0, 10).join(', ')}`);
          if (writable.length) failures.push(`writable by the app user: ${writable.slice(0, 10).join(', ')}`);
          try { writeFileSync('/app/probe', 'x'); failures.push('the app user created /app/probe'); } catch {}
          try { writeFileSync('/tmp/probe', 'x'); rmSync('/tmp/probe'); } catch (error) { failures.push(`/tmp is not writable: ${error}`); }

          const packages = new Set();
          const scan = (modules) => {
            if (!existsSync(modules)) return;
            for (const entry of readdirSync(modules)) {
              if (entry.startsWith('.')) continue;
              const dirs = entry.startsWith('@') ? readdirSync(join(modules, entry)).map((n) => join(entry, n)) : [entry];
              for (const dir of dirs) {
                const root = join(modules, dir);
                if (lstatSync(root).isSymbolicLink()) { packages.add(dir); continue; }
                const manifest = join(root, 'package.json');
                if (existsSync(manifest)) packages.add(JSON.parse(readFileSync(manifest, 'utf8')).name ?? dir);
                scan(join(root, 'node_modules'));
              }
            }
          };
          scan('/app/node_modules');
          const required = ['express', 'socket.io', 'bullmq', 'ioredis', 'postgres', 'drizzle-orm', 'zod', '@oxy.so/core', '@oxy.so/db', '@move/backend', '@move/shared-types'];
          for (const name of required) if (!packages.has(name)) failures.push(`missing runtime package ${name} (is the walk blind?)`);
          const forbidden = (name) =>
            ['expo', 'react', 'react-dom', 'react-native', 'typescript', 'drizzle-kit', 'pino-pretty', '@biomejs/biome', '@move/frontend', '@types/bun', '@types/express'].includes(name) ||
            /^(expo-|@expo\/|react-native-|@react-native\/|@react-native-|@react-navigation\/|@oxy\.so\/(services|bloom|app-preset))/.test(name);
          const leaked = [...packages].filter(forbidden).sort();
          if (leaked.length) failures.push(`frontend or dev packages in the runtime image: ${leaked.join(', ')}`);
          if (existsSync('/app/packages/frontend')) failures.push('/app/packages/frontend exists');

          console.log(`runtime /app: ${packages.size} packages, ${files} files, ${(bytes / 1048576).toFixed(1)} MiB`);
          if (failures.length) { for (const f of failures) console.error(`::error::${f}`); process.exit(1); }
          console.log('uid 1001, every /app path root-owned and read-only to it, /tmp writable, no frontend or dev packages');
          JS
          docker run --rm -v "$RUNNER_TEMP/assert-image.mjs:/assert-image.mjs:ro" --entrypoint bun "$IMAGE" /assert-image.mjs
          docker run --rm --entrypoint sh "$IMAGE" -c 'id; du -sh /app/node_modules'

      - name: The production migrator applies every migration
        run: |
          docker run --rm --network host -e DATABASE_URL "$IMAGE" \
            bun packages/backend/dist/src/db/migrate.js --target-database=move_ci --phase=all

      - name: The server boots and reports ready
        run: |
          set -euo pipefail
          docker run -d --name move --network host -e DATABASE_URL -e REDIS_URL -e PORT=3000 "$IMAGE"
          ready='.status == "ready" and .dependencies.postgres == "ready" and .dependencies.migrations == "ready" and .dependencies.redis == "ready"'
          for _ in $(seq 1 60); do
            body="$(curl -sS --max-time 5 http://127.0.0.1:3000/ready 2>/dev/null || true)"
            if jq -e "$ready" >/dev/null 2>&1 <<<"$body"; then echo "$body"; exit 0; fi
            sleep 1
          done
          echo "::error::/ready never reported ready with Postgres, migrations and Redis: $body"
          exit 1

      - name: The post-deploy smoke passes against the container
        env:
          API_ORIGIN: http://127.0.0.1:3000
        run: bash .github/scripts/smoke-move.sh

      - name: The Dockerfile HEALTHCHECK turns healthy
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            status="$(docker inspect move --format '{{ .State.Health.Status }}')"
            [ "$status" = healthy ] && { echo "HEALTHCHECK: $status"; exit 0; }
            sleep 5
          done
          echo "::error::HEALTHCHECK never turned healthy (last: $status)"
          docker inspect move --format '{{ json .State.Health }}'
          exit 1

      - name: Server logs
        if: always()
        run: docker logs move 2>&1 | tail -n 200 || true

  ci-complete:
    name: CI complete
    needs: [changes, quality, lockfile, tests, web, image]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to have passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          failures=()
          result_of() { jq -r --arg job "$1" '.[$job].result' <<<"$RESULTS"; }
          changes="$(result_of changes)"
          if [ "$IS_PR" = true ]; then
            [ "$changes" = success ] || failures+=("changes did not pass: $changes")
          elif [ "$changes" != skipped ]; then
            failures+=("changes ran outside a pull request: $changes")
          fi
          for job in quality lockfile tests web image; do
            result="$(result_of "$job")"
            affected=true
            if [ "$IS_PR" = true ] && [ "$changes" = success ]; then
              case "$job" in
                tests|web|image) affected="$(jq -r --arg job "$job" '.changes.outputs[$job] // "true"' <<<"$RESULTS")" ;;
              esac
            fi
            if [ "$result" = success ]; then continue; fi
            if [ "$result" = skipped ] && [ "$affected" = false ]; then
              echo "$job skipped: the pull request does not reach it"
              continue
            fi
            failures+=("$job did not pass: $result")
          done
          if [ ${#failures[@]} -gt 0 ]; then
            for failure in "${failures[@]}"; do echo "::error::$failure"; done
            exit 1
          fi
          echo 'Every CI job passed.'
